name: Example screenshots

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: thebrandonlucas/kai/.github/actions/setup-kai@fd316fbad644f2e52c620ad83385fcc4b9c31372 # v0.0.12
        with:
          version: 0.0.12
          nix: 'false'
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
      - run: kai check
      - run: kai run screenshots-setup -- --with-deps
      - run: kai run screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plume-screenshots
          path: .screenshots-out/
          include-hidden-files: true
          if-no-files-found: error
