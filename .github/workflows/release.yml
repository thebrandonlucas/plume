name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; leave empty for a dry run
        type: string
        default: ''
      nightly-tag:
        description: Exact nightly for diagnostics; leave empty for latest
        type: string
        default: ''

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # TODO(thebrandonlucas/roc-automation): the fork's release-package.yml with
    # a Kai path beside the Blueprint one: Kai's setup-kai action, `kai run`
    # for every task, and a kai-tool action for docs-path. Pinned to the head of the fork's kai branch.
    uses: thebrandonlucas/roc-automation/.github/workflows/release-package.yml@19a848eef6e345a671191da6fa6818918c815aa6
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
      manual: true

  documentation:
    name: Publish release documentation
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: Release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      docs-version: ${{ needs.Release.outputs.version }}
